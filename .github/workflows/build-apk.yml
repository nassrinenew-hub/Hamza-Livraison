name: Build Hamza Livraison APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip Hamza_Livraison_Android_Project.zip -d src

      - name: Build APK
        run: |
          cd src
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hamza-Livraison-APK
          path: src/app/build/outputs/apk/debug/app-debug.apk
          on:
  workflow_dispatch:
